# Fluxo GitOps:
#   push na main -> builda imagem -> publica no GHCR -> atualiza a tag no
#   repo platform-gitops -> Argo CD percebe a mudança e faz o deploy.
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/alecknipphoffdacruz/app-front-b
  GITOPS_REPO: AlecKnipphoffDaCruz/platform-gitops
  OVERLAY: apps/front-b/overlays/dev

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64  # arm64 = Mac Apple Silicon
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          build-args: APP_VERSION=${{ steps.tag.outputs.tag }}

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Atualiza a tag da imagem no overlay dev
        run: |
          yq -i '(.images[] | select(.name == "app-front-b")).newTag = "${{ needs.build.outputs.tag }}"' $OVERLAY/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(app-front-b): ${{ needs.build.outputs.tag }} em dev"
          git push
